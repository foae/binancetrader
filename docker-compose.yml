services:
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, always]
    volumes:
      - binancetrader_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      HTTP_LISTEN_ADDRESS: 0.0.0.0:8123
      LOG_FILE: "-"
    ports:
      - "127.0.0.1:8123:8123"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  binancetrader_redis_data:
